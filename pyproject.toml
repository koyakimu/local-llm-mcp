[project]
name = "local-llm-mcp"
version = "0.1.1"
description = "MCP server that lets Claude Code (or any MCP client) hand private or bulk text work to a local OpenAI-compatible LLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.scripts]
local-llm-mcp = "local_llm_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
